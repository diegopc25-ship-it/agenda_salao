{% extends "base.html" %}
{% block content %}
<div class="card">
<h1>Fazer marcação</h1>
<form method="post">
<label>Nome<input name="name" required></label>
<label>Contacto<input name="phone" required placeholder="Telefone ou e-mail"></label>
<label>Serviço
<select name="service_id" required>
<option value="">Escolha...</option>
{% for s in services %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
</select></label>
<label>Data<input id="date" type="date" name="date" min="{{ today }}" required></label>
<label>Horário
<select id="time" name="time" required><option value="">Escolha primeiro a data...</option></select>
</label>
<label>Observações<textarea name="notes" rows="4" placeholder="Alguma informação importante?"></textarea></label>
<button class="button" type="submit">Enviar marcação</button>
</form>
</div>
<script>
const date = document.getElementById('date');
const time = document.getElementById('time');
date.addEventListener('change', async () => {
  time.innerHTML = '<option>Carregando...</option>';
  const r = await fetch('/api/slots?date=' + encodeURIComponent(date.value));
  const slots = await r.json();
  time.innerHTML = slots.length ? '<option value="">Escolha...</option>' + slots.map(x=>`<option value="${x}">${x}</option>`).join('') : '<option value="">Sem horários disponíveis</option>';
});
</script>
{% endblock %}
