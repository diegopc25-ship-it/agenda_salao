<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ salon.name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="brand" href="{{ url_for('home') }}">{{ salon.name }}</a>
    <a class="button small" href="{{ url_for('booking') }}">Fazer marcação</a>
  </div>
</header>
<main class="wrap">
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
<footer><div class="wrap">{{ salon.address }} · {{ salon.phone }}</div></footer>
</body>
</html>
